<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WHISPERER</title><link rel="stylesheet" href="assets/style.css"></head>
<body class="scan"><canvas id="rain"></canvas><button id="snd"></button><div id="hud"></div>
<main><h1>WHISPERER</h1><p class="tag">THE PROPHECY HAS BEGUN</p>
<div class="win"><div class="bar"><i></i><i></i><i></i>&nbsp;WHISPERER://TERMINAL</div>
<div class="body"><div id="out"></div><div class="row" id="prompt"><span>guest@whisperer:~$</span><input id="in" autocomplete="off" autocapitalize="characters" spellcheck="false" autofocus></div></div></div></main>
<script src="assets/rain.js"></script><script src="assets/audio.js"></script>
<script type="module">
import {decrypt} from './assets/crypto.js';
const out=document.getElementById('out'),inp=document.getElementById('in'),sb=document.getElementById('snd');
const say=t=>{const p=document.createElement('p');p.className='line';p.textContent=t;out.appendChild(p)};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
inp.addEventListener('input',()=>{inp.value=inp.value.toUpperCase()});
const label=()=>sb.textContent='SOUND: '+(snd.isMuted()?'OFF':'ON');label();
sb.onclick=e=>{e.stopPropagation();snd.start();snd.mute(!snd.isMuted());label()};
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>snd.start(),{once:true}));
(async()=>{for(const l of ['> INITIALIZING SIGNAL...','> SCANNING FREQUENCIES...','> CONNECTION ESTABLISHED',"> TYPE 'BEGIN' TO CONTINUE"]){await type(l);await wait(250)}})();
document.addEventListener('click',()=>{const b=document.querySelector('.code input');(b||inp).focus()});
window.pill=c=>{
  if(c==='red'){(DEV&&location.search.includes('skip'))?snake():rabbit(snake);return}
  const l=document.createElement('div');l.className='loop';document.body.appendChild(l);
  let n=0;const t=setInterval(()=>{l.textContent+='GO BACK TO SLEEP '.repeat(8);if(++n>150)clearInterval(t)},40);
};
inp.addEventListener('keydown',async e=>{
  if(e.key!=='Enter')return;const v=inp.value.trim();inp.value='';say('guest@whisperer:~$ '+v);
  if(v.toLowerCase()==='begin'){document.getElementById('prompt').style.display='none';
    await type('> IDENTITY CHECK REQUIRED...');
    const d=document.createElement('div');d.className='tn';d.textContent='TEMET NOSCE';out.appendChild(d);await wait(1400);
    await type('> KNOW THE ONE WHO CALLED YOU HERE.');await type('> ENTER 6-DIGIT ACCESS CODE');boxes()}
  else say('> UNKNOWN COMMAND');
});
function boxes(){
  const row=document.createElement('div');row.className='code';const vals=Array(6).fill('');
  const bs=[...Array(6)].map(()=>{const i=document.createElement('input');i.maxLength=2;i.inputMode='numeric';i.autocomplete='off';row.appendChild(i);return i});
  out.appendChild(row);bs[0].focus();
  const go=()=>{if(vals.join('').length===6)check(vals.join(''),bs,row,vals)};
  bs.forEach((b,n)=>{
    b.addEventListener('input',()=>{const d=b.value.replace(/\D/g,'').slice(-1);vals[n]=d;b.value=d?'*':'';if(d&&n<5)bs[n+1].focus();go()});
    b.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!b.value&&n>0)bs[n-1].focus()});
    b.addEventListener('paste',e=>{const t=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);if(!t)return;e.preventDefault();[...t].forEach((d,k)=>{vals[k]=d;bs[k].value='*'});go()});
  });
}
async function check(code,bs,row,vals){
  const h=await decrypt(code,await (await fetch('content/pill.json')).json());
  if(h===null){say('> ACCESS DENIED');row.classList.add('bad');setTimeout(()=>{row.classList.remove('bad');vals.fill('');bs.forEach(b=>b.value='');bs[0].focus()},700);return}
  document.querySelector('main').innerHTML=h;
}
const DEV=true; // DEV: set to false before launch (hides the SKIP button and the ?skip shortcut)
function snake(){
  if(DEV&&location.search.includes('skip')){video();return}
  document.querySelector('main').innerHTML='<div class="win" id="w"><div class="bar"><i></i><i></i><i></i>&nbsp;WHISPERER://SNAKE.EXE</div><div class="body"><div>SCORE <b id="s">0</b></div><canvas id="c" width="400" height="240"></canvas><p class="line" id="m">ARROWS OR SWIPE TO START / EAT THE SIGNAL</p></div></div>';
  const $=id=>document.getElementById(id),c=$('c'),g=c.getContext('2d'),N=20,W=20,H=12,init=()=>[[5,6],[4,6],[3,6]];
  let sn=init(),dir=[1,0],nd=dir,f=[12,6],sc=0,run=1,go=0;
  const put=()=>{do f=[Math.random()*W|0,Math.random()*H|0];while(sn.some(p=>p[0]==f[0]&&p[1]==f[1]))};
  const draw=()=>{g.fillStyle='#010603';g.fillRect(0,0,400,240);g.fillStyle='#37ff7a';sn.forEach(p=>g.fillRect(p[0]*N+1,p[1]*N+1,N-2,N-2));g.fillStyle='#d8ffe6';g.fillRect(f[0]*N+4,f[1]*N+4,N-8,N-8)};
  const ouro=done=>{const n=sn.length,R=85,cx=200,cy=120,from=sn.map(p=>[p[0]*N+N/2,p[1]*N+N/2]),t0=performance.now();
    (function f(now){const e=Math.min(1,(now-t0)/1400),s=e*e*(3-2*e),rot=(now-t0)/900;
      g.fillStyle='#010603';g.fillRect(0,0,400,240);
      sn.forEach((p,i)=>{const a=rot+i/n*6.283,x=from[i][0]+(cx+R*Math.cos(a)-from[i][0])*s,y=from[i][1]+(cy+R*Math.sin(a)-from[i][1])*s;
        g.fillStyle=i?'#37ff7a':'#d8ffe6';g.fillRect(x-9,y-9,i?18:22,i?18:22)});
      if(Math.random()<.4){const y=Math.random()*220|0,hh=6+Math.random()*28|0;g.drawImage(c,0,y,400,hh,(Math.random()*50-25)|0,y,400,hh)}
      if(Math.random()<.1){g.fillStyle='rgba(255,60,90,.22)';g.fillRect(0,0,400,240)}
      if(Math.random()<.15)snd.noise();
      now-t0<2800?requestAnimationFrame(f):done()})(t0)};
  const win=()=>{run=0;$('w').classList.add('glitch');$('m').textContent='> SIGNAL OVERFLOW... THE SNAKE CONSUMES ITSELF...';
    setTimeout(()=>{$('w').classList.remove('glitch');ouro(()=>glitchOut(()=>swirl(video)))},600)};
  const tick=()=>{if(!run||!go)return;dir=nd;const h=[sn[0][0]+dir[0],sn[0][1]+dir[1]];
    if(h[0]<0||h[1]<0||h[0]>=W||h[1]>=H||sn.some(p=>p[0]==h[0]&&p[1]==h[1])){sn=init();dir=nd=[1,0];sc=0;go=0;$('s').textContent=0;put();return draw()}
    sn.unshift(h);if(h[0]==f[0]&&h[1]==f[1]){sc++;$('s').textContent=sc;snd.ping();put();if(sc>=20)return win()}else sn.pop();draw()};
  const turn=m=>{if(m[0]+dir[0]||m[1]+dir[1]){nd=m;go=1}};
  addEventListener('keydown',e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(m){turn(m);e.preventDefault()}});
  let t0;c.addEventListener('touchstart',e=>{t0=e.touches[0]},{passive:true});
  c.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-t0.clientX,dy=t.clientY-t0.clientY;turn(Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)])});
  put();draw();setInterval(tick,110);
  if(DEV){const b=document.createElement('button');b.className='nxt';b.textContent='SKIP (DEV)';b.onclick=()=>{run=0;video()};document.querySelector('main').appendChild(b)}
}
function glitchOut(done){
  const w=document.getElementById('w'),m=document.getElementById('m'),b=document.body,junk='#%&*<>01XZ@$';let n=0;
  const t=setInterval(()=>{
    w.style.transform='translate('+((Math.random()*30-15)|0)+'px,'+((Math.random()*10-5)|0)+'px) skewX('+(Math.random()*8-4).toFixed(1)+'deg)';
    const r=Math.random();b.style.filter=r<.25?'invert(1) hue-rotate(90deg)':r<.5?'contrast(2) saturate(2)':'';
    m.textContent=Array.from({length:30},()=>junk[Math.random()*junk.length|0]).join('');
    snd.noise();
    if(++n>16){clearInterval(t);w.style.transform='';b.style.filter='';done()}
  },90);
}
function swirl(done){
  const k=document.createElement('canvas');k.width=innerWidth;k.height=innerHeight;k.style.cssText='position:fixed;inset:0;z-index:30';document.body.appendChild(k);
  const x=k.getContext('2d'),cx=k.width/2,cy=k.height/2,R=Math.hypot(cx,cy)+40,d=30,len=Math.PI*R*R/d,ds=Math.max(2,len/150/60);
  x.strokeStyle='#37ff7a';x.lineWidth=d+2;x.lineCap='round';snd.sweep(2.6);
  let th=0,px=cx,py=cy;
  (function f(){
    x.beginPath();x.moveTo(px,py);
    for(let i=0;i<60;i++){const r=Math.max(d*th/6.283,4);th+=Math.min(ds/r,.3);const rr=d*th/6.283;px=cx+rr*Math.cos(th);py=cy+rr*Math.sin(th);x.lineTo(px,py)}
    x.stroke();
    if(d*th/6.283<R)requestAnimationFrame(f);
    else{done();k.style.transition='opacity 1s';k.style.opacity=0;setTimeout(()=>k.remove(),1100)}
  })();
}
function video(){
  document.querySelector('main').innerHTML='<div class="win vid"><div class="bar"><i></i><i></i><i></i>&nbsp;WHISPERER://SIGNAL</div><div class="body"><video id="v" controls playsinline preload="metadata" src="assets/video.mp4"></video><p class="line" id="vm">> SEVEN FLECKS CARRY A MESSAGE. ENTER WHAT YOU FOUND.</p><div class="row"><span>></span><input id="ans" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ENTER WORD"></div></div></div>';
  const v=document.getElementById('v'),a=document.getElementById('ans');
  if(window.ruinsHTML){const b=document.createElement('button');b.className='nxt';b.textContent='RETURN TO RUINS >';b.onclick=()=>{snd.duck(0);document.querySelector('main').innerHTML=window.ruinsHTML};document.querySelector('.vid .body').appendChild(b)}
  v.onerror=()=>{document.getElementById('vm').textContent='> SIGNAL LOST. VIDEO COULD NOT LOAD (ERROR '+(v.error?v.error.code:'?')+'). 4 MEANS FILE MISSING OR UNSUPPORTED FORMAT.'};
  a.addEventListener('input',()=>{a.value=a.value.toUpperCase()});
  v.onplay=()=>snd.duck(1);v.onpause=v.onended=()=>snd.duck(0);
  a.addEventListener('keydown',async e=>{if(e.key!=='Enter')return;const w=a.value.trim();a.value='';
    const h=await decrypt(w,await (await fetch('content/ruins.json')).json());
    if(h===null)document.getElementById('vm').textContent='> ACCESS DENIED';else portal(h)});
}
function portal(h){
  const m=document.querySelector('main');
  m.innerHTML='<div class="portal"><div class="ring" id="rg"></div><p class="line">> A DOOR HAS OPENED BETWEEN TWO WORLDS. STEP THROUGH.</p><button class="nxt" onclick="video()">&lt; BACK TO VIDEO</button></div>';
  const rg=document.getElementById('rg');
  rg.onclick=()=>{rg.onclick=null;rg.classList.add('go');snd.sweep(2);
    setTimeout(()=>{const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;z-index:30;background:#ffc94a;transition:opacity 1.2s';document.body.appendChild(o);
      document.body.classList.add('gold');startRuins();window.ruinsHTML=h;m.innerHTML=h;
      requestAnimationFrame(()=>requestAnimationFrame(()=>o.style.opacity=0));setTimeout(()=>o.remove(),1400)},1700)};
}
window.go=d=>{const s=[...document.querySelectorAll('.scr')],i=s.findIndex(e=>e.classList.contains('on')),j=i+d;
  if(j<0){snd.duck(0);video();return}if(j>=s.length)return;
  s[i].classList.remove('on');s[j].classList.add('on');document.querySelector('.nxt.fwd').style.visibility=j<s.length-1?'visible':'hidden'};
window.video=video;
window.nxt=()=>go(1);window.prv=()=>go(-1);
document.addEventListener('click',e=>{const m=e.target.closest&&e.target.closest('.oldw.map img');if(!m)return;
  const FX=.500,FY=.409,R=941/1672; // centre of the black cross on the map (fractions of width/height)
  const o=document.createElement('div'),im=document.createElement('img');let w=innerWidth<700?2600:Math.max(innerWidth*1.5,2800);
  o.style.cssText='position:fixed;inset:0;z-index:40;background:#000;overflow:auto';
  im.src=m.src;im.style.cssText='display:block;max-width:none;width:'+w+'px';
  const zoom=k=>{const cx=(o.scrollLeft+innerWidth/2)/w,cy=(o.scrollTop+innerHeight/2)/(w*R);w=Math.min(5000,Math.max(innerWidth,w*k));im.style.width=w+'px';o.scrollLeft=cx*w-innerWidth/2;o.scrollTop=cy*w*R-innerHeight/2};
  const btn=(t,l,f)=>{const b=document.createElement('button');b.textContent=t;b.className='nxt';b.style.cssText='position:fixed;z-index:41;bottom:.8rem;left:'+l+';margin:0;background:#000c';b.onclick=ev=>{ev.stopPropagation();f()};return b};
  o.append(im,btn('-','.8rem',()=>zoom(1/1.4)),btn('+','4rem',()=>zoom(1.4)),btn('CLOSE','7.2rem',()=>o.remove()));
  document.body.appendChild(o);o.scrollLeft=FX*w-innerWidth/2;o.scrollTop=FY*w*R-innerHeight/2});
async function type(t,ms=22){const p=document.createElement('p');p.className='line';out.appendChild(p);for(const ch of t){p.textContent+=ch;await wait(ms)}}
const hud=document.getElementById('hud'),hudTick=()=>{hud.textContent='\u25CF NODE 7F3A  '+new Date().toTimeString().slice(0,8)+'  GUEST'};hudTick();setInterval(hudTick,1000);
function rabbit(done){
  const k=document.createElement('canvas');k.width=innerWidth;k.height=innerHeight;
  k.style.cssText='position:fixed;inset:0;z-index:50;background:#000;opacity:0;transition:opacity .4s';document.body.appendChild(k);
  requestAnimationFrame(()=>k.style.opacity=1);
  const x=k.getContext('2d'),u=Math.max(6,Math.round(innerWidth/70)),Y=k.height*.58,T=3000,msg='FOLLOW THE WHITE RABBIT',t0=performance.now();
  const R=(a,b,w,h)=>x.fillRect(a*u,b*u,w*u,h*u);let ls=-1,ended=0;
  (function f(now){
    const t=now-t0,p=Math.min(1,t/T),st=Math.floor(t/130)%2,X=-18*u+(k.width+36*u)*p;
    x.clearRect(0,0,k.width,k.height);
    const n=Math.max(0,Math.min(msg.length,Math.floor((t-600)/45))),al=t<2300?1:Math.max(0,1-(t-2300)/500);
    x.font='bold '+Math.max(16,u*2.4)+'px monospace';x.textAlign='center';x.fillStyle='rgba(55,255,122,'+al+')';
    x.shadowColor='#37ff7a';x.shadowBlur=14;x.fillText(msg.slice(0,n)+(n<msg.length&&st?'_':''),k.width/2,k.height*.35);x.shadowBlur=0;
    x.fillStyle='rgba(55,255,122,.45)';for(let i=1;i<16;i++){const tx=X-i*u*1.5;if(tx>0)x.fillRect(tx,Y+u*(5+(i*7%6)),u*.6,u*.6)}
    x.save();x.translate(X,Y-(st?u:0));x.shadowColor='#fff';x.shadowBlur=u;
    x.fillStyle='#fff';R(0,4,11,5);R(9,3,5,5);R(10,0,2,4);R(12,0,2,4);R(-2,5,2,2);
    if(st){R(-1,8,3,2);R(11,8,3,2)}else{R(0,9,3,2);R(9,9,3,2)}
    x.shadowBlur=0;x.fillStyle='#f9a';R(10,1,1,2);R(12,1,1,2);x.fillStyle='#e33';R(12,4,1,1);x.restore();
    if(st!==ls){ls=st;snd.noise()}
    if(t<T+300)requestAnimationFrame(f);else if(!ended){ended=1;done();k.style.opacity=0;setTimeout(()=>k.remove(),450)}
  })(t0);
}
</script></body></html>
