<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WHISPERER</title><link rel="stylesheet" href="assets/style.css"></head>
<body class="scan"><canvas id="rain"></canvas><button id="snd"></button>
<main><h1>WHISPERER</h1><p class="tag">THE PROPHECY HAS BEGUN</p>
<div class="win"><div class="bar"><i></i><i></i><i></i>&nbsp;WHISPERER://TERMINAL</div>
<div class="body"><div id="out"></div><div class="row" id="prompt"><span>guest@whisperer:~$</span><input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus></div></div></div></main>
<script src="assets/rain.js"></script><script src="assets/audio.js"></script>
<script type="module">
import {decrypt} from './assets/crypto.js';
const out=document.getElementById('out'),inp=document.getElementById('in'),sb=document.getElementById('snd');
const say=t=>{const p=document.createElement('p');p.className='line';p.textContent=t;out.appendChild(p)};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const label=()=>sb.textContent='SOUND: '+(snd.isMuted()?'OFF':'ON');label();
sb.onclick=e=>{e.stopPropagation();snd.start();snd.mute(!snd.isMuted());label()};
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>snd.start(),{once:true}));
(async()=>{for(const l of ['> INITIALIZING SIGNAL...','> SCANNING FREQUENCIES...','> CONNECTION ESTABLISHED',"> TYPE 'BEGIN' TO CONTINUE"]){say(l);await wait(500)}})();
document.addEventListener('click',()=>{const b=document.querySelector('.code input');(b||inp).focus()});
window.pill=c=>{
  if(c==='red'){snake();return}
  const l=document.createElement('div');l.className='loop';document.body.appendChild(l);
  let n=0;const t=setInterval(()=>{l.textContent+='GO BACK TO SLEEP '.repeat(8);if(++n>150)clearInterval(t)},40);
};
inp.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;const v=inp.value.trim();inp.value='';say('guest@whisperer:~$ '+v);
  if(v.toLowerCase()==='begin'){document.getElementById('prompt').style.display='none';say('> ENTER 6-DIGIT ACCESS CODE');boxes()}
  else say('> UNKNOWN COMMAND');
});
function boxes(){
  const row=document.createElement('div');row.className='code';const vals=Array(6).fill('');
  const bs=[...Array(6)].map(()=>{const i=document.createElement('input');i.maxLength=2;i.inputMode='numeric';i.autocomplete='off';row.appendChild(i);return i});
  out.appendChild(row);bs[0].focus();
  const go=()=>{if(vals.join('').length===6)check(vals.join(''),bs,row,vals)};
  bs.forEach((b,n)=>{
    b.addEventListener('input',()=>{const d=b.value.replace(/\D/g,'').slice(-1);vals[n]=d;b.value=d?'*':'';if(d&&n<5)bs[n+1].focus();go()});
    b.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!b.value&&n>0)bs[n-1].focus()});
    b.addEventListener('paste',e=>{const t=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);if(!t)return;e.preventDefault();[...t].forEach((d,k)=>{vals[k]=d;bs[k].value='*'});go()});
  });
}
async function check(code,bs,row,vals){
  const h=await decrypt(code,await (await fetch('content/pill.json')).json());
  if(h===null){say('> ACCESS DENIED');row.classList.add('bad');setTimeout(()=>{row.classList.remove('bad');vals.fill('');bs.forEach(b=>b.value='');bs[0].focus()},700);return}
  document.querySelector('main').innerHTML=h;
}
function snake(){
  document.querySelector('main').innerHTML='<div class="win" id="w"><div class="bar"><i></i><i></i><i></i>&nbsp;WHISPERER://SNAKE.EXE</div><div class="body"><div>SCORE <b id="s">0</b></div><canvas id="c" width="400" height="240"></canvas><p class="line" id="m">ARROWS OR SWIPE TO START / EAT THE SIGNAL</p></div></div>';
  const $=id=>document.getElementById(id),c=$('c'),g=c.getContext('2d'),N=20,W=20,H=12,init=()=>[[5,6],[4,6],[3,6]];
  let sn=init(),dir=[1,0],nd=dir,f=[12,6],sc=0,run=1,go=0;
  const put=()=>{do f=[Math.random()*W|0,Math.random()*H|0];while(sn.some(p=>p[0]==f[0]&&p[1]==f[1]))};
  const draw=()=>{g.fillStyle='#010603';g.fillRect(0,0,400,240);g.fillStyle='#37ff7a';sn.forEach(p=>g.fillRect(p[0]*N+1,p[1]*N+1,N-2,N-2));g.fillStyle='#d8ffe6';g.fillRect(f[0]*N+4,f[1]*N+4,N-8,N-8)};
  const win=()=>{run=0;$('w').classList.add('glitch');$('m').textContent='> SIGNAL OVERFLOW... THE SNAKE CONSUMES ITSELF...';
    setTimeout(()=>{$('w').classList.remove('glitch');$('m').textContent='> SIGNAL CAPTURED. (NEXT STAGE: TODO)'},2500)};
  const tick=()=>{if(!run||!go)return;dir=nd;const h=[sn[0][0]+dir[0],sn[0][1]+dir[1]];
    if(h[0]<0||h[1]<0||h[0]>=W||h[1]>=H||sn.some(p=>p[0]==h[0]&&p[1]==h[1])){sn=init();dir=nd=[1,0];sc=0;go=0;$('s').textContent=0;put();return draw()}
    sn.unshift(h);if(h[0]==f[0]&&h[1]==f[1]){sc++;$('s').textContent=sc;snd.ping();put();if(sc>=20)return win()}else sn.pop();draw()};
  const turn=m=>{if(m[0]+dir[0]||m[1]+dir[1]){nd=m;go=1}};
  addEventListener('keydown',e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(m){turn(m);e.preventDefault()}});
  let t0;c.addEventListener('touchstart',e=>{t0=e.touches[0]},{passive:true});
  c.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-t0.clientX,dy=t.clientY-t0.clientY;turn(Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)])});
  put();draw();setInterval(tick,110);
}
</script></body></html>
